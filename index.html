<!DOCTYPE html>
<html lang="zh-CN">
<head>

<style>
  :root{
    --bg:#F7F4F0;
    --card:#FFFFFF;
    --ink:#4A4843;
    --ink-2:#8C877F;
    --line:#EDE7DF;
    --pink:#D3A79B;
    --blue:#93A3B0;
    --green:#A5B79C;
    --pink-bg:#FBF5F2;
    --track:#F2EDE6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:16px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:480px;
    margin:0 auto;
    padding:0 20px calc(40px + env(safe-area-inset-bottom));
    min-height:100vh;
  }
  .screen{display:none;}
  .screen.show{display:block;animation:fade .3s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

  /* ---------- 按钮 ---------- */
  .btn{
    display:block;width:100%;border:none;border-radius:16px;
    font-size:16px;font-family:inherit;font-weight:500;
    padding:16px;cursor:pointer;transition:transform .15s ease,background .2s ease;
    letter-spacing:.5px;
  }
  .main-btn{background:#6E6A63;color:#fff;margin-top:28px;}
  .main-btn:disabled{background:#D9D3CB;color:#fff;cursor:default;}
  .main-btn:active:not(:disabled){transform:scale(.985);}
  .ghost-btn{background:#fff;color:var(--ink);border:1px solid var(--line);margin-top:14px;}
  .ghost-btn:active{transform:scale(.985);}

  /* ---------- 封面 ---------- */
  #cover{padding-top:76px;}
  .cover-kicker{
    font-size:12px;color:var(--ink-2);letter-spacing:3px;margin:0 0 22px;
  }
  #cover h1{
    font-size:32px;line-height:1.42;margin:0 0 24px;font-weight:600;letter-spacing:1px;
  }
  #cover h1 span{
    background:linear-gradient(transparent 62%, #F0E2DC 62%);
  }
  .cover-desc{
    font-size:15px;color:var(--ink-2);line-height:2.05;margin:0;
  }
  .cover-note{
    text-align:center;font-size:12px;color:#B5AFA6;margin:22px 0 0;letter-spacing:1px;
  }

  /* ---------- 答题 ---------- */
  .quiz-head{display:flex;align-items:center;gap:12px;padding:30px 0 22px;}
  .progress{flex:1;height:5px;background:#E9E3DA;border-radius:99px;overflow:hidden;}
  .progress-bar{height:100%;width:0;background:var(--pink);border-radius:99px;transition:width .3s ease;}
  .counter{font-size:12px;color:var(--ink-2);white-space:nowrap;letter-spacing:.5px;}

  .q-index{font-size:12px;color:var(--pink);letter-spacing:2px;margin:0 0 10px;font-weight:600;}
  .q-text{font-size:20px;line-height:1.6;margin:0 0 26px;font-weight:600;letter-spacing:.3px;}

  .opt{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    background:#fff;border:1.5px solid var(--line);border-radius:16px;
    padding:15px 16px;margin-bottom:11px;font-family:inherit;font-size:15px;
    color:var(--ink);cursor:pointer;transition:all .18s ease;line-height:1.55;
  }
  .opt-key{
    flex:0 0 24px;height:24px;border-radius:9px;background:var(--track);color:var(--ink-2);
    font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:600;
    transition:all .18s ease;
  }
  .opt.sel{border-color:var(--pink);background:var(--pink-bg);}
  .opt.sel .opt-key{background:var(--pink);color:#fff;}

  /* ---------- 结果 ---------- */
  .res-head{text-align:center;padding:46px 0 22px;}
  .res-kicker{font-size:12px;color:var(--ink-2);letter-spacing:3px;margin:0 0 14px;}
  .res-name{font-size:30px;margin:0 0 12px;font-weight:600;letter-spacing:1px;}
  .res-tag{font-size:14px;color:var(--ink-2);margin:0 0 26px;line-height:1.7;}
  .res-match{display:inline-flex;align-items:baseline;gap:3px;}
  #resPercent{font-size:54px;font-weight:600;color:var(--pink);line-height:1;letter-spacing:-2px;}
  .res-match small{font-size:20px;color:var(--pink);}
  .res-match em{font-size:12px;color:var(--ink-2);font-style:normal;margin-left:8px;letter-spacing:1px;}

  .bars{background:#fff;border-radius:20px;padding:20px 20px 18px;margin:6px 0 14px;}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:13px;}
  .bar-row:last-child{margin-bottom:0;}
  .bar-name{font-size:13px;width:34px;color:var(--ink-2);flex:0 0 34px;}
  .bar-track{flex:1;height:8px;background:var(--track);border-radius:99px;overflow:hidden;}
  .bar-track i{display:block;height:100%;border-radius:99px;}
  .bar-val{font-size:12px;color:var(--ink-2);width:36px;text-align:right;flex:0 0 36px;}

  .res-card{background:#fff;border-radius:20px;padding:18px 20px;margin-bottom:12px;}
  .res-card h3{margin:0 0 8px;font-size:15px;font-weight:600;letter-spacing:.5px;}
  .res-card p{margin:0;font-size:14.5px;line-height:1.9;color:#5F5B54;}

  .res-also{
    text-align:center;font-size:13px;color:var(--ink-2);
    margin:18px 0 6px;line-height:1.8;
  }
  .footer-note{
    text-align:center;font-size:12px;color:#B5AFA6;margin:24px 0 0;letter-spacing:1px;
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- ========== 封面 ========== -->
  <section id="cover" class="screen show">
    <p class="cover-kicker">15 题 · 约 1 分钟</p>
    <h1>你的骨子里<br>藏着<span>哪种人格</span>？</h1>
    <p class="cover-desc">
      有些人天生柔软，见不得别人为难；<br>
      有些人自带锋芒，遇事从不退让；<br>
      还有些人只想安静躺平，谁也别来烦。<br>
      回答 15 道小题，看看你骨子里是谁。
    </p>
    <button class="btn main-btn" id="startBtn">开始测试</button>
    <p class="cover-note">凭直觉选，没有对错</p>
  </section>

  <!-- ========== 答题 ========== -->
  <section id="quiz" class="screen">
    <div class="quiz-head">
      <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
      <span class="counter" id="counter">1 / 15</span>
    </div>
    <p class="q-index" id="qIndex">Q1</p>
    <h2 class="q-text" id="qText"></h2>
    <div id="opts"></div>
    <button class="btn main-btn" id="nextBtn" disabled>下一题</button>
  </section>

  <!-- ========== 结果 ========== -->
  <section id="result" class="screen">
    <div class="res-head">
      <p class="res-kicker">你 的 骨 子 里 是</p>
      <h2 class="res-name" id="resName"></h2>
      <p class="res-tag" id="resTag"></p>
      <div class="res-match">
        <span id="resPercent">0</span><small>%</small><em>匹配度</em>
      </div>
    </div>

    <div class="bars" id="bars"></div>

    <div class="res-card">
      <h3>✨ 人格亮点</h3>
      <p id="resHighlight"></p>
    </div>
    <div class="res-card">
      <h3>🏡 适合待在什么环境</h3>
      <p id="resEnv"></p>
    </div>
    <div class="res-card">
      <h3>🌧 你的小缺点</h3>
      <p id="resFlaw"></p>
    </div>

    <p class="res-also" id="resAlso"></p>
    <button class="btn ghost-btn" id="retryBtn">重新测试</button>
    <p class="footer-note">截图分享给朋友，看看他们是什么型 🌿</p>
  </section>

</div>

  }
];

/* ================= 逻辑 ================= */
const $ = id => document.getElementById(id);
let current = 0;
let answers = new Array(QUESTIONS.length).fill(null);

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('show'));
  $(id).classList.add('show');
  window.scrollTo(0, 0);
}

function renderQuestion(i) {
  const q = QUESTIONS[i];
  $('qIndex').textContent = 'Q' + (i + 1);
  $('qText').textContent = q.q;
  $('counter').textContent = (i + 1) + ' / ' + QUESTIONS.length;
  $('progressBar').style.width = ((i + 1) / QUESTIONS.length * 100) + '%';

  const optsEl = $('opts');
  optsEl.innerHTML = '';
  q.opts.forEach((o, idx) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'opt' + (answers[i] === idx ? ' sel' : '');
    b.innerHTML = '<span class="opt-key">' + 'ABCD'[idx] + '</span><span class="opt-text">' + o.t + '</span>';
    b.addEventListener('click', () => selectOption(i, idx));
    optsEl.appendChild(b);
  });

  const nextBtn = $('nextBtn');
  nextBtn.disabled = answers[i] === null;
  nextBtn.textContent = (i === QUESTIONS.length - 1) ? '看结果' : '下一题';
}

function selectOption(qi, oi) {
  answers[qi] = oi;
  const kids = $('opts').children;
  for (let k = 0; k < kids.length; k++) {
    kids[k].classList.toggle('sel', k === oi);
  }
  $('nextBtn').disabled = false;
}

$('nextBtn').addEventListener('click', () => {
  if (current < QUESTIONS.length - 1) {
    current++;
    renderQuestion(current);
    window.scrollTo(0, 0);
  } else {
    showResult();
  }
});

function showResult() {
  let w = 0, l = 0, f = 0;
  answers.forEach((ai, qi) => {
    const s = QUESTIONS[qi].opts[ai].s;
    w += s[0]; l += s[1]; f += s[2];
  });
  const total = w + l + f || 1;
  const p = { w: w / total, l: l / total, f: f / total };

  const ranked = TYPES.map(t => ({
    t,
    d: Math.sqrt(
      Math.pow(p.w - t.w, 2) +
      Math.pow(p.l - t.l, 2) +
      Math.pow(p.f - t.f, 2)
    )
  })).sort((a, b) => a.d - b.d);

  const best = ranked[0].t;
  const second = ranked[1].t;
  const match = Math.round(Math.max(62, Math.min(98, 98 - ranked[0].d * 58)));

  $('resName').textContent = best.name;
  $('resTag').textContent = best.tag;
  $('resPercent').textContent = match;
  $('resHighlight').textContent = best.highlight;
  $('resEnv').textContent = best.env;
  $('resFlaw').textContent = best.flaw;

  const barsData = [
    { name: '温柔', val: p.w, color: '#D3A79B' },
    { name: '狼戾', val: p.l, color: '#93A3B0' },
    { name: '佛系', val: p.f, color: '#A5B79C' }
  ];
  $('bars').innerHTML = barsData.map(b => {
    const v = Math.round(b.val * 100);
    return '<div class="bar-row">' +
      '<span class="bar-name">' + b.name + '</span>' +
      '<div class="bar-track"><i style="width:' + v + '%;background:' + b.color + '"></i></div>' +
      '<span class="bar-val">' + v + '%</span>' +
      '</div>';
  }).join('');

  $('resAlso').textContent = '你身上还有一点「' + second.name + '」的影子';
  showScreen('result');
}

$('startBtn').addEventListener('click', () => {
  current = 0;
  answers = new Array(QUESTIONS.length).fill(null);
  renderQuestion(0);
  showScreen('quiz');
});

$('retryBtn').addEventListener('click', () => {
  current = 0;
  answers = new Array(QUESTIONS.length).fill(null);
  renderQuestion(0);
  showScreen('quiz');
});
</script>
</body>
